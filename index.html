<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arbiter">
<meta name="theme-color" content="#14181A">
<meta name="description" content="Play chess against Arbiter, a strong offline chess engine that runs entirely in your browser.">
<title>Arbiter — chess engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#14181A;
  --panel:#1B2124;
  --panel-2:#222A2D;
  --line:#2E383C;
  --buff:#D9D4C3;
  --board-dark:#456658;
  --ink:#E7E3D8;
  --ink-dim:#8A9598;
  --chalk:#E9C46A;
  --red:#C8553D;
  --radius:3px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overscroll-behavior:none;
  touch-action:manipulation;
}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 96px}

/* ---------- header ---------- */
header{display:flex;align-items:baseline;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
h1{
  font-family:"IBM Plex Sans Condensed",sans-serif;
  font-weight:700;font-size:26px;letter-spacing:.14em;text-transform:uppercase;
  margin:0;color:var(--ink);
}
h1 span{color:var(--chalk)}
.tagline{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim);margin-left:auto;text-align:right}

/* ---------- player strips ---------- */
.player{display:flex;align-items:center;gap:8px;padding:7px 2px;font-size:12px}
.player .who{font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.player .taken{color:var(--ink-dim);font-size:15px;letter-spacing:-2px;line-height:1;flex:1;overflow:hidden;white-space:nowrap}
.player .adv{color:var(--chalk);font-size:11px;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.dot.on{background:var(--chalk);box-shadow:0 0 0 3px rgba(233,196,106,.16)}
.dot.think{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- board ---------- */
.boardrow{display:flex;gap:8px;align-items:stretch}
.board{
  flex:1;display:grid;
  grid-template-columns:repeat(8,1fr);
  grid-template-rows:repeat(8,1fr);
  aspect-ratio:1/1;
  border:1px solid #0C0F10;
  box-shadow:0 10px 30px rgba(0,0,0,.45);
  position:relative;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sq.light{background:var(--buff)}
.sq.dark{background:var(--board-dark)}
.sq.last::before{content:"";position:absolute;inset:0;background:var(--chalk);opacity:.30}
.sq.sel::before{content:"";position:absolute;inset:0;background:var(--chalk);opacity:.45}
.sq.check::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,var(--red) 0%,transparent 72%);opacity:.85}
.pc{
  position:relative;z-index:2;
  font-family:"Apple Symbols","Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",sans-serif;
  font-size:var(--pcsize,34px);line-height:1;
  pointer-events:none;
  transition:transform .09s ease;
}
.pc.w{color:#FBF9F3;-webkit-text-stroke:1.1px #171A17;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.pc.b{color:#151A18;-webkit-text-stroke:1.1px #C9C6BA;text-shadow:0 1px 1px rgba(0,0,0,.3)}
.hint{position:absolute;z-index:3;width:26%;height:26%;border-radius:50%;background:rgba(20,24,26,.34)}
.sq.light .hint{background:rgba(20,24,26,.26)}
.hint.cap{width:100%;height:100%;border-radius:0;background:none;box-shadow:inset 0 0 0 4px rgba(20,24,26,.32)}
.coord{position:absolute;z-index:4;font-size:8px;font-weight:600;opacity:.55;letter-spacing:0}
.coord.f{right:2px;bottom:1px}
.coord.r{left:2px;top:1px}
.sq.light .coord{color:var(--board-dark)}
.sq.dark .coord{color:var(--buff)}

/* eval flag */
.evalbar{width:9px;background:#0F1213;position:relative;border:1px solid #0C0F10;flex:none}
.evalfill{position:absolute;left:0;right:0;bottom:0;background:var(--buff);transition:height .35s cubic-bezier(.2,.8,.3,1)}
.evalmid{position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(233,196,106,.5)}

/* ---------- engine tape ---------- */
.tape{
  margin-top:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:8px 10px;font-size:11px;color:var(--ink-dim);
  min-height:52px;
}
.tape .row1{display:flex;gap:14px;flex-wrap:wrap;letter-spacing:.04em}
.tape b{color:var(--ink);font-weight:600}
.tape .line{margin-top:4px;color:var(--chalk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.verdict{color:var(--ink);font-weight:600;letter-spacing:.06em}

/* ---------- score sheet ---------- */
.sheet{margin-top:12px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.sheet h2{
  margin:0;padding:7px 10px;background:var(--panel-2);
  font-family:"IBM Plex Sans Condensed",sans-serif;font-size:11px;font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim);
  display:flex;justify-content:space-between;align-items:center;
}
.sheet h2 button{
  background:none;border:0;color:var(--ink-dim);font:inherit;letter-spacing:.12em;
  cursor:pointer;padding:2px 4px;
}
.rows{max-height:170px;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--panel)}
.mrow{display:grid;grid-template-columns:34px 1fr 1fr;border-bottom:1px solid rgba(46,56,60,.55);font-size:12.5px}
.mrow:last-child{border-bottom:0}
.mrow span{padding:4px 8px}
.mrow .n{color:var(--ink-dim);border-right:1px solid rgba(46,56,60,.55);font-size:11px}
.mrow .w{border-right:1px solid rgba(46,56,60,.55)}
.mrow .cur{background:rgba(233,196,106,.14);color:var(--chalk)}
.empty{padding:12px 10px;color:var(--ink-dim);font-size:11.5px}

/* ---------- controls ---------- */
.levels{display:flex;gap:4px;margin-top:12px}
.levels button{
  flex:1;padding:8px 2px;background:var(--panel);color:var(--ink-dim);
  border:1px solid var(--line);border-radius:var(--radius);
  font:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
}
.levels button.on{background:var(--chalk);color:#14181A;border-color:var(--chalk);font-weight:700}
.bar{
  position:fixed;left:0;right:0;bottom:0;background:rgba(20,24,26,.96);
  border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:6px;max-width:560px;margin:0 auto;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.bar button{
  flex:1;padding:11px 4px;background:var(--panel-2);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--radius);
  font:inherit;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
}
.bar button:active{background:var(--chalk);color:#14181A}
.bar button.primary{background:var(--chalk);color:#14181A;font-weight:700;border-color:var(--chalk)}

/* ---------- overlays ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(10,13,14,.82);z-index:50;
  display:none;align-items:center;justify-content:center;padding:20px;
}
.overlay.on{display:flex}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;max-width:340px;width:100%;text-align:center;
}
.card h3{
  font-family:"IBM Plex Sans Condensed",sans-serif;margin:0 0 6px;
  font-size:20px;letter-spacing:.12em;text-transform:uppercase;
}
.card p{margin:0 0 16px;color:var(--ink-dim);font-size:12px}
.card .choices{display:flex;gap:8px;justify-content:center}
.card .choices button{
  flex:1;font-size:30px;padding:10px 0;background:var(--panel-2);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;line-height:1;
}
.card .go{width:100%;padding:12px;background:var(--chalk);color:#14181A;border:0;
  border-radius:var(--radius);font:inherit;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;cursor:pointer;font-size:12px}
.side-pick{display:flex;gap:8px;margin-bottom:12px}
.side-pick button{
  flex:1;padding:10px;background:var(--panel-2);color:var(--ink-dim);border:1px solid var(--line);
  border-radius:var(--radius);font:inherit;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;cursor:pointer;
}
.side-pick button.on{background:var(--chalk);color:#14181A;border-color:var(--chalk);font-weight:700}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:60;
  background:var(--chalk);color:#14181A;padding:8px 14px;border-radius:var(--radius);
  font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  opacity:0;transition:opacity .2s;pointer-events:none;
}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Arb<span>i</span>ter</h1>
    <div class="tagline">chess engine<br>runs on your phone</div>
  </header>

  <div class="player" id="topPlayer">
    <span class="dot" id="topDot"></span>
    <span class="who" id="topName">Arbiter</span>
    <span class="taken" id="topTaken"></span>
    <span class="adv" id="topAdv"></span>
  </div>

  <div class="boardrow">
    <div class="board" id="board"></div>
    <div class="evalbar" title="Evaluation">
      <div class="evalfill" id="evalFill" style="height:50%"></div>
      <div class="evalmid"></div>
    </div>
  </div>

  <div class="player" id="botPlayer">
    <span class="dot on" id="botDot"></span>
    <span class="who" id="botName">You</span>
    <span class="taken" id="botTaken"></span>
    <span class="adv" id="botAdv"></span>
  </div>

  <div class="tape">
    <div class="row1">
      <span>depth <b id="tDepth">—</b></span>
      <span>eval <b id="tEval">0.00</b></span>
      <span>nodes <b id="tNodes">0</b></span>
      <span>knps <b id="tNps">0</b></span>
    </div>
    <div class="line" id="tLine">Tap a piece to move. Arbiter thinks while you watch.</div>
  </div>

  <div class="levels" id="levels"></div>

  <div class="sheet">
    <h2>Score sheet <button id="copyPgn">Copy PGN</button></h2>
    <div class="rows" id="rows"><div class="empty">No moves yet.</div></div>
  </div>
</div>

<div class="bar">
  <button id="btnNew" class="primary">New game</button>
  <button id="btnUndo">Undo</button>
  <button id="btnFlip">Flip</button>
  <button id="btnSound">Sound on</button>
</div>

<div class="overlay" id="promoOverlay">
  <div class="card">
    <h3>Promote</h3>
    <p>Choose the piece your pawn becomes.</p>
    <div class="choices" id="promoChoices"></div>
  </div>
</div>

<div class="overlay" id="newOverlay">
  <div class="card">
    <h3 id="newTitle">New game</h3>
    <p id="newSub">Pick your colour.</p>
    <div class="side-pick" id="sidePick">
      <button data-side="w" class="on">White</button>
      <button data-side="b">Black</button>
      <button data-side="r">Random</button>
    </div>
    <button class="go" id="newGo">Start</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function ChessCore() {
  'use strict';
  var G = (typeof self !== 'undefined') ? self : globalThis;

  var EMPTY = 0;
  var P = 1, N = 2, B = 3, R = 4, Q = 5, K = 6;
  var WHITE = 0, BLACK = 8;

  var KNIGHT_OFF = [-33, -31, -18, -14, 14, 18, 31, 33];
  var BISHOP_OFF = [-17, -15, 15, 17];
  var ROOK_OFF = [-16, -1, 1, 16];
  var KING_OFF = [-17, -16, -15, -1, 1, 15, 16, 17];

  var CW_K = 1, CW_Q = 2, CB_K = 4, CB_Q = 8;

  function mk(from, to, promo, cap, ep, castle, dbl) {
    return from | (to << 7) | (promo << 14) | (cap << 18) | (ep << 22) | (castle << 23) | (dbl << 24);
  }
  function mFrom(m) { return m & 127; }
  function mTo(m) { return (m >> 7) & 127; }
  function mPromo(m) { return (m >> 14) & 15; }
  function mCap(m) { return (m >> 18) & 15; }
  function mEp(m) { return (m >> 22) & 1; }
  function mCastle(m) { return (m >> 23) & 1; }
  function mDbl(m) { return (m >> 24) & 1; }
  function onBoard(sq) { return (sq & 0x88) === 0; }

  function rnd32() { return (Math.random() * 0x100000000) >>> 0; }
  var ZP = [];
  for (var zi = 0; zi < 16; zi++) {
    ZP[zi] = new Uint32Array(256);
    for (var zs = 0; zs < 256; zs++) ZP[zi][zs] = rnd32();
  }
  var ZSIDE = rnd32();
  var ZCASTLE = new Uint32Array(16);
  for (var zc = 0; zc < 16; zc++) ZCASTLE[zc] = rnd32();
  var ZEP = new Uint32Array(256);
  for (var ze = 0; ze < 256; ze++) ZEP[ze] = rnd32();

  function algToSq(a) { return (a.charCodeAt(1) - 49) * 16 + (a.charCodeAt(0) - 97); }
  function sqToAlg(sq) { return String.fromCharCode(97 + (sq & 15)) + String.fromCharCode(49 + (sq >> 4)); }
  function pieceChar(p) {
    var c = ' pnbrqk'[p & 7];
    return (p & BLACK) ? c : c.toUpperCase();
  }

  /* ===================== Position ===================== */
  function Position(fen) {
    this.board = new Int8Array(128);
    this.side = WHITE;
    this.castling = 0;
    this.ep = -1;
    this.half = 0;
    this.full = 1;
    this.kings = [-1, -1];
    this.hash = 0;
    this.history = [];
    this.repList = [];
    this.setFen(fen || 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1');
  }

  Position.prototype.setFen = function (fen) {
    this.board.fill(0);
    var parts = fen.trim().split(/\s+/);
    var rows = parts[0].split('/');
    var map = { p: P | BLACK, n: N | BLACK, b: B | BLACK, r: R | BLACK, q: Q | BLACK, k: K | BLACK, P: P, N: N, B: B, R: R, Q: Q, K: K };
    for (var r = 0; r < 8; r++) {
      var row = rows[r], file = 0, rank = 7 - r;
      for (var i = 0; i < row.length; i++) {
        var ch = row[i];
        if (ch >= '1' && ch <= '8') { file += +ch; continue; }
        var sq = rank * 16 + file;
        this.board[sq] = map[ch];
        if (map[ch] === K) this.kings[0] = sq;
        if (map[ch] === (K | BLACK)) this.kings[1] = sq;
        file++;
      }
    }
    this.side = parts[1] === 'b' ? BLACK : WHITE;
    this.castling = 0;
    if (parts[2] && parts[2] !== '-') {
      if (parts[2].indexOf('K') >= 0) this.castling |= CW_K;
      if (parts[2].indexOf('Q') >= 0) this.castling |= CW_Q;
      if (parts[2].indexOf('k') >= 0) this.castling |= CB_K;
      if (parts[2].indexOf('q') >= 0) this.castling |= CB_Q;
    }
    this.ep = (parts[3] && parts[3] !== '-') ? algToSq(parts[3]) : -1;
    this.half = parts[4] ? +parts[4] : 0;
    this.full = parts[5] ? +parts[5] : 1;
    this.history = [];
    this.hash = this.computeHash();
    this.repList = [this.hash];
  };

  Position.prototype.fen = function () {
    var s = '';
    for (var r = 7; r >= 0; r--) {
      var empty = 0;
      for (var f = 0; f < 8; f++) {
        var p = this.board[r * 16 + f];
        if (!p) { empty++; continue; }
        if (empty) { s += empty; empty = 0; }
        s += pieceChar(p);
      }
      if (empty) s += empty;
      if (r) s += '/';
    }
    s += this.side === WHITE ? ' w ' : ' b ';
    var c = '';
    if (this.castling & CW_K) c += 'K';
    if (this.castling & CW_Q) c += 'Q';
    if (this.castling & CB_K) c += 'k';
    if (this.castling & CB_Q) c += 'q';
    s += c || '-';
    s += ' ' + (this.ep >= 0 ? sqToAlg(this.ep) : '-');
    s += ' ' + this.half + ' ' + this.full;
    return s;
  };

  Position.prototype.computeHash = function () {
    var h = 0;
    for (var sq = 0; sq < 128; sq++) {
      if (sq & 0x88) continue;
      var p = this.board[sq];
      if (p) h ^= ZP[p][sq];
    }
    if (this.side === BLACK) h ^= ZSIDE;
    h ^= ZCASTLE[this.castling];
    if (this.ep >= 0) h ^= ZEP[this.ep];
    return h >>> 0;
  };

  Position.prototype.attacked = function (sq, byColor) {
    var t, i, d, p, bd = this.board;
    if (byColor === WHITE) {
      t = sq - 15; if (onBoard(t) && bd[t] === P) return true;
      t = sq - 17; if (onBoard(t) && bd[t] === P) return true;
    } else {
      t = sq + 15; if (onBoard(t) && bd[t] === (P | BLACK)) return true;
      t = sq + 17; if (onBoard(t) && bd[t] === (P | BLACK)) return true;
    }
    for (i = 0; i < 8; i++) { t = sq + KNIGHT_OFF[i]; if (onBoard(t) && bd[t] === (N | byColor)) return true; }
    for (i = 0; i < 8; i++) { t = sq + KING_OFF[i]; if (onBoard(t) && bd[t] === (K | byColor)) return true; }
    for (i = 0; i < 4; i++) {
      d = BISHOP_OFF[i]; t = sq + d;
      while (onBoard(t)) {
        p = bd[t];
        if (p) { if (p === (B | byColor) || p === (Q | byColor)) return true; break; }
        t += d;
      }
    }
    for (i = 0; i < 4; i++) {
      d = ROOK_OFF[i]; t = sq + d;
      while (onBoard(t)) {
        p = bd[t];
        if (p) { if (p === (R | byColor) || p === (Q | byColor)) return true; break; }
        t += d;
      }
    }
    return false;
  };

  Position.prototype.inCheck = function (color) {
    var k = this.kings[color === WHITE ? 0 : 1];
    return k >= 0 && this.attacked(k, color ^ BLACK);
  };

  Position.prototype.genMoves = function (capturesOnly) {
    var out = [], bd = this.board;
    var us = this.side, them = us ^ BLACK;
    for (var sq = 0; sq < 128; sq++) {
      if (sq & 0x88) continue;
      var pc = bd[sq];
      if (!pc || (pc & BLACK) !== us) continue;
      var type = pc & 7, i, t, tp, d, offs;

      if (type === P) {
        var dir = us === WHITE ? 16 : -16;
        var startRank = us === WHITE ? 1 : 6;
        var promoRank = us === WHITE ? 6 : 1;
        var rank = sq >> 4;
        var caps = [dir - 1, dir + 1];
        for (i = 0; i < 2; i++) {
          t = sq + caps[i];
          if (!onBoard(t)) continue;
          tp = bd[t];
          if (tp && (tp & BLACK) === them) {
            if (rank === promoRank) {
              out.push(mk(sq, t, Q, tp, 0, 0, 0)); out.push(mk(sq, t, R, tp, 0, 0, 0));
              out.push(mk(sq, t, B, tp, 0, 0, 0)); out.push(mk(sq, t, N, tp, 0, 0, 0));
            } else out.push(mk(sq, t, 0, tp, 0, 0, 0));
          } else if (!tp && t === this.ep) {
            out.push(mk(sq, t, 0, P | them, 1, 0, 0));
          }
        }
        if (capturesOnly) {
          t = sq + dir;
          if (rank === promoRank && onBoard(t) && !bd[t]) out.push(mk(sq, t, Q, 0, 0, 0, 0));
          continue;
        }
        t = sq + dir;
        if (onBoard(t) && !bd[t]) {
          if (rank === promoRank) {
            out.push(mk(sq, t, Q, 0, 0, 0, 0)); out.push(mk(sq, t, R, 0, 0, 0, 0));
            out.push(mk(sq, t, B, 0, 0, 0, 0)); out.push(mk(sq, t, N, 0, 0, 0, 0));
          } else {
            out.push(mk(sq, t, 0, 0, 0, 0, 0));
            var t2 = sq + dir * 2;
            if (rank === startRank && !bd[t2]) out.push(mk(sq, t2, 0, 0, 0, 0, 1));
          }
        }
        continue;
      }

      if (type === N || type === K) {
        offs = type === N ? KNIGHT_OFF : KING_OFF;
        for (i = 0; i < 8; i++) {
          t = sq + offs[i];
          if (!onBoard(t)) continue;
          tp = bd[t];
          if (tp && (tp & BLACK) === us) continue;
          if (capturesOnly && !tp) continue;
          out.push(mk(sq, t, 0, tp, 0, 0, 0));

    'd4 Nf6 Nf3 e6 c4 b6 g3 Bb7 Bg2 Be7',
    'd4 f5 g3 Nf6 Bg2 g6 Nf3 Bg7 O-O O-O c4 d6',
    'd4 e6 c4 f5 g3 Nf6 Bg2 Be7 Nf3 O-O',
    'c4 e5 Nc3 Nf6 Nf3 Nc6 g3 d5 cxd5 Nxd5',
    'c4 Nf6 Nc3 e6 Nf3 d5 d4 Be7 Bg5 O-O',
    'c4 c5 Nf3 Nf6 Nc3 Nc6 g3 g6 Bg2 Bg7',
    'Nf3 d5 g3 Nf6 Bg2 e6 O-O Be7 d3 O-O',
    'Nf3 Nf6 c4 e6 Nc3 d5 d4 Be7 Bf4 O-O',
    'g3 d5 Nf3 Nf6 Bg2 e6 O-O Be7 d3 O-O'
  ];
  var BOOK = null;

  function stripSAN(s) { return s.replace(/[+#!?]/g, ''); }

  function parseSAN(pos, sanRaw) {
    var san = stripSAN(sanRaw);
    var legal = pos.legalMoves(), i;
    if (san === 'O-O' || san === 'O-O-O') {
      var wantFile = san === 'O-O' ? 6 : 2;
      for (i = 0; i < legal.length; i++)
        if (mCastle(legal[i]) && (mTo(legal[i]) & 15) === wantFile) return legal[i];
      return 0;
    }
    var promo = 0;
    var eq = san.indexOf('=');
    if (eq >= 0) { promo = ' PNBRQK'.indexOf(san[eq + 1]); san = san.slice(0, eq); }
    var type = P, body = san;
    if ('NBRQK'.indexOf(san[0]) >= 0) { type = ' PNBRQK'.indexOf(san[0]); body = san.slice(1); }
    body = body.replace('x', '');
    var dest = body.slice(-2);
    var disamb = body.slice(0, -2);
    var destSq = algToSq(dest);
    var dFile = -1, dRank = -1;
    for (i = 0; i < disamb.length; i++) {
      var ch = disamb[i];
      if (ch >= 'a' && ch <= 'h') dFile = ch.charCodeAt(0) - 97;
      else if (ch >= '1' && ch <= '8') dRank = ch.charCodeAt(0) - 49;
    }
    for (i = 0; i < legal.length; i++) {
      var m = legal[i];
      if (mTo(m) !== destSq) continue;
      if ((pos.board[mFrom(m)] & 7) !== type) continue;
      if (promo && mPromo(m) !== promo) continue;
      if (!promo && mPromo(m) && mPromo(m) !== Q) continue;
      if (dFile >= 0 && (mFrom(m) & 15) !== dFile) continue;
      if (dRank >= 0 && (mFrom(m) >> 4) !== dRank) continue;
      return m;
    }
    return 0;
  }

  function bookKey(pos) {
    var f = pos.fen().split(' ');
    return f[0] + ' ' + f[1] + ' ' + f[2] + ' ' + f[3];
  }

  function buildBook() {
    BOOK = {};
    for (var i = 0; i < BOOK_LINES.length; i++) {
      var p = new Position();
      var toks = BOOK_LINES[i].split(' ');
      for (var j = 0; j < toks.length; j++) {
        var m = parseSAN(p, toks[j]);
        if (!m) break;
        var key = bookKey(p);
        var entry = BOOK[key] || (BOOK[key] = []);
        var f = mFrom(m), t = mTo(m), pr = mPromo(m), dup = false;
        for (var k = 0; k < entry.length; k++)
          if (entry[k].f === f && entry[k].t === t && entry[k].p === pr) { entry[k].n++; dup = true; break; }
        if (!dup) entry.push({ f: f, t: t, p: pr, n: 1 });
        p.makeMove(m);
      }
    }
  }

  function bookMove(pos) {
    if (!BOOK) buildBook();
    var entry = BOOK[bookKey(pos)];
    if (!entry || !entry.length) return 0;
    var total = 0, i;
    for (i = 0; i < entry.length; i++) total += entry[i].n;
    var r = Math.random() * total, acc = 0, pick = entry[0];
    for (i = 0; i < entry.length; i++) { acc += entry[i].n; if (r <= acc) { pick = entry[i]; break; } }
    var legal = pos.legalMoves();
    for (i = 0; i < legal.length; i++)
      if (mFrom(legal[i]) === pick.f && mTo(legal[i]) === pick.t && mPromo(legal[i]) === pick.p) return legal[i];
    return 0;
  }

  /* ---- level-based move choice ---- */
  function chooseMove(pos, level, onInfo) {
    var cfg = LEVELS[level] || LEVELS[3];
    if (cfg.book !== false && (pos.repList.length - 1) < 16) {
      var bm = bookMove(pos);
      if (bm) return { best: bm, score: 0, depth: 0, nodes: 0, time: 0, book: true, list: [{ move: bm, score: 0 }] };
    }
    var res = think(pos, { maxDepth: cfg.depth, moveTime: cfg.time, onInfo: onInfo });
    if (!res.list.length) return res;
    var top = res.list[0].score;
    var pool = [];
    for (var i = 0; i < res.list.length; i++) {
      if (top - res.list[i].score <= cfg.slack) pool.push(res.list[i]);
    }
    if (cfg.slack > 0 && pool.length > 1 && Math.random() < cfg.wobble) {
      var pick = pool[1 + ((Math.random() * (pool.length - 1)) | 0)];
      res.best = pick.move;
      res.score = pick.score;
    }
    return res;
  }

  var LEVELS = {
    1: { name: 'Skittles', depth: 2, time: 150, slack: 250, wobble: 0.85, book: false },
    2: { name: 'Club', depth: 4, time: 400, slack: 120, wobble: 0.60 },
    3: { name: 'Expert', depth: 8, time: 1000, slack: 40, wobble: 0.35 },
    4: { name: 'Master', depth: 20, time: 2500, slack: 12, wobble: 0.12 },
    5: { name: 'Arbiter', depth: 64, time: 6000, slack: 0, wobble: 0 }
  };

  /* ===================== SAN ===================== */
  function toSAN(pos, m) {
    var from = mFrom(m), to = mTo(m);
    var pc = pos.board[from], type = pc & 7;
    var san;
    if (mCastle(m)) {
      san = (to & 15) === 6 ? 'O-O' : 'O-O-O';
    } else if (type === P) {
      san = (mCap(m) || mEp(m)) ? (sqToAlg(from)[0] + 'x' + sqToAlg(to)) : sqToAlg(to);
      if (mPromo(m)) san += '=' + ' PNBRQK'[mPromo(m)];
    } else {
      var letter = ' PNBRQK'[type];
      var others = pos.legalMoves().filter(function (x) {
        return x !== m && mTo(x) === to && (pos.board[mFrom(x)] & 7) === type;
      });
      var disamb = '';
      if (others.length) {
        var sameFile = others.some(function (x) { return (mFrom(x) & 15) === (from & 15); });
        var sameRank = others.some(function (x) { return (mFrom(x) >> 4) === (from >> 4); });
        if (!sameFile) disamb = sqToAlg(from)[0];
        else if (!sameRank) disamb = sqToAlg(from)[1];
        else disamb = sqToAlg(from);
      }
      san = letter + disamb + ((mCap(m)) ? 'x' : '') + sqToAlg(to);
    }
    pos.makeMove(m);
    var opp = pos.side;
    if (pos.inCheck(opp)) san += pos.legalMoves().length ? '+' : '#';
    pos.unmakeMove();
    return san;
  }

  function gameStatus(pos) {
    var legal = pos.legalMoves();
    if (!legal.length) {
      if (pos.inCheck(pos.side)) return { over: true, result: pos.side === WHITE ? '0-1' : '1-0', reason: 'checkmate' };
      return { over: true, result: '1/2-1/2', reason: 'stalemate' };
    }
    if (pos.half >= 100) return { over: true, result: '1/2-1/2', reason: 'fifty-move rule' };
    var h = pos.hash, count = 0;
    for (var i = 0; i < pos.repList.length; i++) if (pos.repList[i] === h) count++;
    if (count >= 3) return { over: true, result: '1/2-1/2', reason: 'threefold repetition' };
    // insufficient material
    var bd = pos.board, pieces = [];
    for (var sq = 0; sq < 128; sq++) {
      if (sq & 0x88) continue;
      var p = bd[sq];
      if (p && (p & 7) !== K) pieces.push(p & 7);
    }
    if (!pieces.length) return { over: true, result: '1/2-1/2', reason: 'insufficient material' };
    if (pieces.length === 1 && (pieces[0] === N || pieces[0] === B))
      return { over: true, result: '1/2-1/2', reason: 'insufficient material' };
    return { over: false, legal: legal };
  }

  G.ChessAPI = {
    Position: Position, evaluate: evaluate, think: think, chooseMove: chooseMove,
    toSAN: toSAN, gameStatus: gameStatus, clearTT: clearTT, LEVELS: LEVELS,
    parseSAN: parseSAN, bookMove: bookMove, see: see,
    mFrom: mFrom, mTo: mTo, mPromo: mPromo, mCap: mCap, mEp: mEp, mCastle: mCastle,
    sqToAlg: sqToAlg, algToSq: algToSq, pieceChar: pieceChar, mk: mk,
    stop: function () { stopFlag = true; },
    MATE: MATE,
    P: P, N: N, B: B, R: R, Q: Q, K: K, WHITE: WHITE, BLACK: BLACK
  };
}


ChessCore();
</script>

<script>
self.addEventListener('error', function(ev){
  var t = document.getElementById('tLine');
  if(t) t.textContent = 'Error: ' + (ev.message || 'unknown') + ' (line ' + (ev.lineno || '?') + ')';
});

(function(){
'use strict';
var API = self.ChessAPI;
if(!API){
  document.getElementById('tLine').textContent = 'Engine failed to load — try opening this from a web link rather than a downloaded file.';
  return;
}
var WHITE = API.WHITE, BLACK = API.BLACK;

/* ---------- state ---------- */
var pos = new API.Position();
var startFen = pos.fen();
var moveLog = [];            // {f,t,p,san,fen}
var humanColor = WHITE;
var flipped = false;
var level = 3;
var selected = -1;
var legalCache = [];
var thinking = false;
var lastMove = null;
var soundOn = true;
var pendingPromo = null;
var gameOver = false;
var watchdog = null;
var workerProbe = null;

var GLYPH = {1:'\u265F',2:'\u265E',3:'\u265D',4:'\u265C',5:'\u265B',6:'\u265A'};
var LEVEL_NAMES = [null,'Skittles','Club','Expert','Master','Arbiter'];

/* ---------- worker ---------- */
var worker = null;
try {
  var src = '(' + ChessCore.toString() + ')();\n' +
    'var A=self.ChessAPI;' +
    'self.onmessage=function(e){' +
    ' var d=e.data;' +
    ' if(d.cmd==="ping"){self.postMessage({type:"pong"});return;}' +
    ' if(d.cmd!=="go")return;' +
    ' var p=new A.Position(d.fen);' +
    ' for(var i=0;i<d.moves.length;i++){' +
    '   var ms=p.legalMoves();' +
    '   for(var j=0;j<ms.length;j++){' +
    '     if(A.mFrom(ms[j])===d.moves[i].f&&A.mTo(ms[j])===d.moves[i].t&&A.mPromo(ms[j])===(d.moves[i].p||0)){p.makeMove(ms[j]);break;}' +
    '   }' +
    ' }' +
    ' var res=A.chooseMove(p,d.level,function(info){' +
    '   self.postMessage({type:"info",depth:info.depth,score:info.score,nodes:info.nodes,time:info.time,pv:pvSan(p,info.pv)});' +
    ' });' +
    ' self.postMessage({type:"result",f:A.mFrom(res.best),t:A.mTo(res.best),p:A.mPromo(res.best),' +
    '   score:res.score,depth:res.depth,nodes:res.nodes,time:res.time,book:!!res.book});' +
    '};' +
    'function pvSan(p,pv){var out=[],n=0;for(var i=0;i<pv.length;i++){var ok=false,ms=p.legalMoves();' +
    ' for(var j=0;j<ms.length;j++)if(ms[j]===pv[i]){ok=true;break;}' +
    ' if(!ok)break;out.push(A.toSAN(p,pv[i]));p.makeMove(pv[i]);n++;}' +
    ' while(n-->0)p.unmakeMove();return out;}';
  worker = new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
  worker.onmessage = onEngineMessage;
  worker.onerror = function(){ worker = null; };
  // a blob worker is blocked when the page is opened straight off the filesystem,
  // so prove it replies before trusting it with a search
  workerProbe = setTimeout(function(){ worker = null; }, 2500);
  worker.postMessage({ cmd:'ping' });
} catch(e){ worker = null; }

/* ---------- audio ---------- */
var actx = null;
function beep(freq, dur, vol){
  if(!soundOn) return;
  try{
    if(!actx) actx = new (self.AudioContext||self.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol||0.06, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  }catch(e){}
}

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function sqOf(r,f){ return r*16+f; }
function toast(msg){
  var t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('on'); }, 1600);
}

/* ---------- board rendering ---------- */
var squares = [];
function buildBoard(){
  var b = $('board');
  b.innerHTML = '';
  squares = [];
  for(var i=0;i<64;i++){
    var d = document.createElement('div');
    d.className = 'sq';
    d.addEventListener('click', onSquareTap);
    d.addEventListener('touchend', function(ev){
      ev.preventDefault();          // stops the duplicate synthetic click
      onSquareTap({ currentTarget: ev.currentTarget });
    }, { passive: false });
    b.appendChild(d);
    squares.push(d);
  }
}

function render(){
  var st = API.gameStatus(pos);
  var checkSq = -1;
  if(pos.inCheck(pos.side)) checkSq = pos.kings[pos.side===WHITE?0:1];

  for(var vi=0; vi<64; vi++){
    var vr = (vi/8)|0, vf = vi%8;
    var r = flipped ? vr : 7-vr;
    var f = flipped ? 7-vf : vf;
    var sq = sqOf(r,f);
    var el = squares[vi];
    var isLight = (r+f)%2 === 1;
    var cls = 'sq ' + (isLight?'light':'dark');
    if(lastMove && (sq===lastMove.f || sq===lastMove.t)) cls += ' last';
    if(sq === selected) cls += ' sel';
    if(sq === checkSq) cls += ' check';
    el.className = cls;
    el.dataset.sq = sq;

    var html = '';
    var pc = pos.board[sq];
    if(pc){
      html += '<span class="pc ' + ((pc & BLACK)?'b':'w') + '">' + GLYPH[pc & 7] + '</span>';
    }
    for(var k=0;k<legalCache.length;k++){
      if(API.mTo(legalCache[k]) === sq){
        html += '<span class="hint' + ((pos.board[sq] || API.mEp(legalCache[k]))?' cap':'') + '"></span>';
        break;
      }
    }
    if(vf === 0) html += '<span class="coord r">' + (r+1) + '</span>';
    if(vr === 7) html += '<span class="coord f">' + 'abcdefgh'[f] + '</span>';
    el.innerHTML = html;
  }

  renderPlayers();
  renderSheet();
  updateTurnDots();

  if(st.over && !gameOver){
    gameOver = true;
    var msg = st.reason === 'checkmate'
      ? ((st.result === '1-0') === (humanColor === WHITE) ? 'You win — checkmate' : 'Arbiter wins — checkmate')
      : 'Draw — ' + st.reason;
    $('tLine').innerHTML = '<span class="verdict">' + msg + '</span>';
    beep(st.reason === 'checkmate' ? 330 : 400, .35, .08);
    toast(msg);
  }
}

function renderPlayers(){
  var counts = {w:{},b:{}};
  for(var sq=0; sq<128; sq++){
    if(sq & 0x88) continue;
    var p = pos.board[sq];
    if(!p) continue;
    var side = (p & BLACK) ? 'b' : 'w';
    counts[side][p & 7] = (counts[side][p & 7]||0) + 1;
  }
  var full = {1:8,2:2,3:2,4:2,5:1};
  var val = {1:1,2:3,3:3,4:5,5:9};
  var takenBy = {w:'',b:''}, score = {w:0,b:0};
  for(var t in full){
    var wMissing = full[t] - (counts.w[t]||0);
    var bMissing = full[t] - (counts.b[t]||0);
    for(var i=0;i<bMissing;i++){ takenBy.w += GLYPH[t]; score.w += val[t]; }
    for(var j=0;j<wMissing;j++){ takenBy.b += GLYPH[t]; score.b += val[t]; }
  }
  var humanIsWhite = humanColor === WHITE;
  // top strip = the side displayed at top
  var topSide = flipped ? 'w' : 'b';
  var botSide = flipped ? 'b' : 'w';
  $('topName').textContent = ((topSide==='w') === humanIsWhite) ? 'You' : ('Arbiter · ' + LEVEL_NAMES[level]);
  $('botName').textContent = ((botSide==='w') === humanIsWhite) ? 'You' : ('Arbiter · ' + LEVEL_NAMES[level]);
  $('topTaken').textContent = takenBy[topSide];
  $('botTaken').textContent = takenBy[botSide];
  var diff = score[topSide] - score[botSide];
  $('topAdv').textContent = diff > 0 ? '+' + diff : '';
  $('botAdv').textContent = diff < 0 ? '+' + (-diff) : '';
}

function updateTurnDots(){
  var topSide = flipped ? WHITE : BLACK;
  var topTurn = pos.side === topSide;
  $('topDot').className = 'dot' + (topTurn?' on':'') + (topTurn && thinking?' think':'');
  $('botDot').className = 'dot' + (!topTurn?' on':'') + (!topTurn && thinking?' think':'');
}

function renderSheet(){
  var host = $('rows');
  if(!moveLog.length){ host.innerHTML = '<div class="empty">No moves yet.</div>'; return; }
  var html = '';
  var firstIsBlack = new API.Position(startFen).side === BLACK;
  var n = firstIsBlack ? 1 : 1;
  var i = 0;
  if(firstIsBlack){
    html += '<div class="mrow"><span class="n">1</span><span class="w">…</span><span>' + moveLog[0].san + '</span></div>';
    i = 1; n = 2;
  }
  for(; i < moveLog.length; i += 2){
    var w = moveLog[i] ? moveLog[i].san : '';
    var b = moveLog[i+1] ? moveLog[i+1].san : '';
    var wCur = (i === moveLog.length-1) ? ' cur' : '';
    var bCur = (i+1 === moveLog.length-1) ? ' cur' : '';
    html += '<div class="mrow"><span class="n">' + n + '</span>' +
      '<span class="w' + wCur + '">' + w + '</span>' +
      '<span class="' + bCur.trim() + '">' + b + '</span></div>';
    n++;
  }
  host.innerHTML = html;
  host.scrollTop = host.scrollHeight;
}

function setEvalBar(scoreWhitePov){
  var pct;
  if(Math.abs(scoreWhitePov) > API.MATE - 200){
    pct = scoreWhitePov > 0 ? 100 : 0;
  } else {
    pct = 50 + 50 * (2/(1+Math.exp(-scoreWhitePov/320)) - 1);
  }
  if(flipped) pct = 100 - pct;
  $('evalFill').style.height = Math.max(2, Math.min(98, pct)) + '%';
}

function fmtEval(scoreWhitePov){
  if(Math.abs(scoreWhitePov) > API.MATE - 200){
    var n = Math.ceil((API.MATE - Math.abs(scoreWhitePov))/2);
    return (scoreWhitePov > 0 ? '+M' : '-M') + n;
  }
  return (scoreWhitePov >= 0 ? '+' : '') + (scoreWhitePov/100).toFixed(2);
}

/* ---------- interaction ---------- */
function onSquareTap(e){
  if(thinking || gameOver || pendingPromo) return;
  if(pos.side !== humanColor) return;
  var sq = +e.currentTarget.dataset.sq;
  var target = null;
  for(var i=0;i<legalCache.length;i++){
    if(API.mTo(legalCache[i]) === sq){ target = legalCache[i]; break; }
  }
  if(target !== null && selected >= 0){
    var promos = legalCache.filter(function(m){ return API.mTo(m) === sq && API.mPromo(m); });
    if(promos.length){ askPromotion(promos); return; }
    applyMove(target);
    return;
  }
  var pc = pos.board[sq];
  if(pc && (pc & BLACK) === humanColor){
    if(selected === sq){ selected = -1; legalCache = []; }
    else{
      selected = sq;
      legalCache = pos.legalMoves().filter(function(m){ return API.mFrom(m) === sq; });
    }
  } else {
    selected = -1; legalCache = [];
  }
  render();
}

function askPromotion(promos){
  pendingPromo = promos;
  var host = $('promoChoices');
  host.innerHTML = '';
  [5,4,3,2].forEach(function(t){
    var b = document.createElement('button');
    b.innerHTML = '<span class="pc ' + (humanColor===WHITE?'w':'b') + '" style="font-size:30px">' + GLYPH[t] + '</span>';
    b.onclick = function(){
      var m = promos.filter(function(x){ return API.mPromo(x) === t; })[0];
      $('promoOverlay').classList.remove('on');
      pendingPromo = null;
      applyMove(m);
    };
    host.appendChild(b);
  });
  $('promoOverlay').classList.add('on');
}

function applyMove(m){
  var san = API.toSAN(pos, m);
  var cap = API.mCap(m) || API.mEp(m);
  pos.makeMove(m);
  moveLog.push({ f:API.mFrom(m), t:API.mTo(m), p:API.mPromo(m), san:san });
  lastMove = { f:API.mFrom(m), t:API.mTo(m) };
  selected = -1; legalCache = [];
  beep(cap ? 200 : 320, .07, cap ? .09 : .05);
  render();
  if(!gameOver) setTimeout(engineTurn, 130);
}

/* ---------- engine ---------- */
function engineTurn(){
  if(gameOver || pos.side === humanColor) return;
  var st = API.gameStatus(pos);
  if(st.over){ render(); return; }
  thinking = true;
  updateTurnDots();
  $('tLine').textContent = 'Arbiter is calculating…';

  var payload = { cmd:'go', fen:startFen, moves:moveLog.map(function(x){ return {f:x.f,t:x.t,p:x.p}; }), level:level };
  if(worker){
    worker.postMessage(payload);
    clearTimeout(watchdog);
    watchdog = setTimeout(function(){
      if(!thinking) return;
      worker = null;            // background thread never answered — run it here instead
      runLocal();
    }, (API.LEVELS[level].time || 6000) + 6000);
  } else {
    runLocal();
  }
}

function runLocal(){
  setTimeout(function(){
    var res = API.chooseMove(pos, level, function(info){
      showInfo(info.depth, info.score, info.nodes, info.time, null);
    });
    if(!res.best) return;
    onEngineMessage({ data:{ type:'result', f:API.mFrom(res.best), t:API.mTo(res.best), p:API.mPromo(res.best),
      score:res.score, depth:res.depth, nodes:res.nodes, time:res.time, book:!!res.book } });
  }, 30);
}

function showInfo(depth, score, nodes, time, pv){
  var whitePov = (pos.side === WHITE) ? score : -score;
  $('tDepth').textContent = depth;
  $('tEval').textContent = fmtEval(whitePov);
  $('tNodes').textContent = nodes > 999999 ? (nodes/1e6).toFixed(1)+'M' : (nodes>999 ? Math.round(nodes/1000)+'k' : nodes);
  $('tNps').textContent = time > 0 ? Math.round(nodes/time) : 0;
  setEvalBar(whitePov);
  if(pv && pv.length) $('tLine').textContent = 'best line: ' + pv.join(' ');
}

function onEngineMessage(e){
  var d = e.data;
  if(d.type === 'pong'){ clearTimeout(workerProbe); return; }
  if(d.type === 'info'){ showInfo(d.depth, d.score, d.nodes, d.time, d.pv); return; }
  if(d.type !== 'result') return;
  clearTimeout(watchdog);
  thinking = false;
  if(!d.book) showInfo(d.depth, d.score, d.nodes, d.time, null);

  var moves = pos.legalMoves(), chosen = null;
  for(var i=0;i<moves.length;i++){
    if(API.mFrom(moves[i])===d.f && API.mTo(moves[i])===d.t && API.mPromo(moves[i])===(d.p||0)){ chosen = moves[i]; break; }
  }
  if(chosen === null){ $('tLine').textContent = 'Engine desync — start a new game.'; return; }

  var san = API.toSAN(pos, chosen);
  var cap = API.mCap(chosen) || API.mEp(chosen);
  pos.makeMove(chosen);
  moveLog.push({ f:d.f, t:d.t, p:d.p, san:san });
  lastMove = { f:d.f, t:d.t };
  beep(cap ? 180 : 260, .07, cap ? .09 : .05);
  if(!gameOver) $('tLine').textContent = d.book
    ? 'Arbiter played ' + san + '  ·  from the opening book'
    : 'Arbiter played ' + san + '  ·  depth ' + d.depth + ' in ' + (d.time/1000).toFixed(1) + 's';
  render();
}

/* ---------- controls ---------- */
function newGame(side){
  if(side === 'r') side = Math.random() < .5 ? 'w' : 'b';
  humanColor = side === 'b' ? BLACK : WHITE;
  flipped = humanColor === BLACK;
  pos = new API.Position();
  startFen = pos.fen();
  moveLog = []; lastMove = null; selected = -1; legalCache = [];
  gameOver = false; thinking = false;
  $('tDepth').textContent = '—'; $('tEval').textContent = '0.00';
  $('tNodes').textContent = '0'; $('tNps').textContent = '0';
  $('tLine').textContent = humanColor === WHITE ? 'You are White. Your move.' : 'You are Black. Arbiter opens.';
  setEvalBar(0);
  render();
  if(pos.side !== humanColor) setTimeout(engineTurn, 350);
}

function undo(){
  if(thinking || !moveLog.length) return;
  var back = 0;
  do { moveLog.pop(); back++; rebuild(); } while(moveLog.length && pos.side !== humanColor);
  gameOver = false;
  $('tLine').textContent = 'Took back ' + back + ' half-move' + (back > 1 ? 's' : '') + '.';
  if(pos.side !== humanColor) setTimeout(engineTurn, 250);
}

function rebuild(){
  pos = new API.Position(startFen);
  for(var i=0;i<moveLog.length;i++){
    var ms = pos.legalMoves();
    for(var j=0;j<ms.length;j++){
      if(API.mFrom(ms[j])===moveLog[i].f && API.mTo(ms[j])===moveLog[i].t && API.mPromo(ms[j])===(moveLog[i].p||0)){
        pos.makeMove(ms[j]); break;
      }
    }
  }
  var last = moveLog[moveLog.length-1];
  lastMove = last ? {f:last.f,t:last.t} : null;
  selected = -1; legalCache = [];
  render();
}

function pgn(){
  var out = '[Event "Casual game"]\n[Site "Arbiter"]\n[Date "' + new Date().toISOString().slice(0,10).replace(/-/g,'.') + '"]\n' +
    '[White "' + (humanColor===WHITE?'You':'Arbiter') + '"]\n[Black "' + (humanColor===BLACK?'You':'Arbiter') + '"]\n';
  var st = API.gameStatus(pos);
  out += '[Result "' + (st.over ? st.result : '*') + '"]\n\n';
  var body = '';
  for(var i=0;i<moveLog.length;i++){
    if(i%2===0) body += (i/2+1) + '. ';
    body += moveLog[i].san + ' ';
  }
  return out + body + (st.over ? st.result : '*') + '\n';
}

function sizePieces(){
  var b = $('board');
  var w = b.clientWidth;
  if(!w) return;
  if(Math.abs(b.clientHeight - w) > 2) b.style.height = w + 'px';   // aspect-ratio fallback
  document.documentElement.style.setProperty('--pcsize', Math.round(w / 8 * 0.80) + 'px');
}
self.addEventListener('resize', sizePieces);
self.addEventListener('orientationchange', function(){ setTimeout(sizePieces, 250); });

/* ---------- wiring ---------- */
buildBoard();
sizePieces();

var lv = $('levels');
for(var L=1; L<=5; L++){
  (function(n){
    var b = document.createElement('button');
    b.textContent = LEVEL_NAMES[n];
    b.className = n === level ? 'on' : '';
    b.onclick = function(){
      level = n;
      Array.prototype.forEach.call(lv.children, function(c,i){ c.className = (i+1===n)?'on':''; });
      toast('Level: ' + LEVEL_NAMES[n]);
      render();
    };
    lv.appendChild(b);
  })(L);
}

$('btnNew').onclick = function(){ $('newOverlay').classList.add('on'); };
$('btnUndo').onclick = undo;
$('btnFlip').onclick = function(){ flipped = !flipped; render(); };
$('btnSound').onclick = function(){
  soundOn = !soundOn;
  $('btnSound').textContent = soundOn ? 'Sound on' : 'Sound off';
  if(soundOn) beep(440,.06,.05);
};
$('copyPgn').onclick = function(){
  var text = pgn();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast('PGN copied'); },function(){ fallbackCopy(text); });
  } else fallbackCopy(text);
};
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('PGN copied'); }catch(e){ toast('Copy failed'); }
  document.body.removeChild(ta);
}

var chosenSide = 'w';
Array.prototype.forEach.call($('sidePick').children, function(b){
  b.onclick = function(){
    chosenSide = b.dataset.side;
    Array.prototype.forEach.call($('sidePick').children, function(x){ x.className = x===b?'on':''; });
  };
});
$('newGo').onclick = function(){ $('newOverlay').classList.remove('on'); newGame(chosenSide); };
$('newOverlay').onclick = function(e){ if(e.target === $('newOverlay')) $('newOverlay').classList.remove('on'); };

render();
sizePieces();
$('tLine').textContent = 'You are White. Tap a piece to begin.';
})();
</script>
